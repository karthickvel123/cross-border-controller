name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "**/requirements*.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: G2 Boundary Isolation Check (lint-imports)
        run: |
          python scripts/check_boundary.py

      - name: Run Test Suite (pytest backend/tests/ -v)
        run: |
          pytest backend/tests/ -v

      - name: Run Spend-Free Evaluation Harness (200 records)
        run: |
          python -m eval.harness --dry-run --seed 20261122

      - name: Security Vulnerability Scan (pip-audit)
        run: |
          pip-audit || true
